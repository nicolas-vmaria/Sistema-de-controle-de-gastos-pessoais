<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Dados - organized.</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../style/gernDados.css">
</head>

<body>

    <!-- NAV -->
    <nav>
        <a href="home.html" class="nav-logo">organized.</a>
        <div class="nav-user">
            <span class="nav-user-name">Olá, <span id="nameUser"></span></span>
            <div class="nav-avatar" id="nav-avatar"><i class="fa-solid fa-user"></i></div>
            <button id="sair-conta">Sair</button>
        </div>
    </nav>

    <!-- MAIN -->
    <div class="page-wrapper">

        <!-- Header -->
        <div class="page-header">
            <div class="label">Finanças pessoais</div>
            <h1>Gerenciamento<br>de Dados</h1>
            <p>Adicione seu saldo e registre seus gastos aqui.</p>
        </div>

        <!-- Saldo Card -->
        <div class="saldo-card">
            <div class="saldo-info">
                <div class="saldo-label">Saldo atual</div>
                <div id="saldo">R$ 0,00</div>
            </div>

            <div>
                <div>Gastos Totais</div>
                <div id="gastos-totais">R$ 0,00</div>
            </div>
            <div class="saldo-actions">
                <button class="btn-primary open-modal" data-modal="modal-1">Enviar Saldo</button>
                <button class="btn-secondary open-modal" data-modal="modal-2">Adicionar Gasto</button>
            </div>
        </div>

        <!-- Gastos -->
        <div class="gastos-section" id="gastos-container">
            <div class="section-heading">Seus gastos</div>
            <ul class="gastos-list" id="listaGastos">
                <li class="empty-state" id="empty-state">Nenhum gasto registrado ainda.</li>
            </ul>
            <button class="open-modal" data-modal="modal-3">Filtro</button>
        </div>

    </div>

    <!-- MODAL 1 — Salário -->
    <dialog id="modal-1">
        <div class="modal-header">
            <span class="modal-title">Adicionar salário</span>
            <button class="close-modal" type="button" data-modal="modal-1">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="input-group">
            <label for="valorSalario">Valor do salário</label>
            <input type="text" id="valorSalario" placeholder="Ex: 2000,00">
        </div>
        <button class="btn-confirm" id="btnSalario">Salvar saldo</button>
    </dialog>

    <!-- MODAL 2 — Gasto -->
    <dialog id="modal-2">
        <div class="modal-header">
            <span class="modal-title">Adicionar gasto</span>
            <button class="close-modal" type="button" data-modal="modal-2">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="input-group">
            <label for="gastosInput">Valor do gasto</label>
            <input type="text" id="gastosInput" placeholder="Ex: 150,00">
        </div>
        <div class="input-group">
            <label for="dataGastos">Data do gasto</label>
            <input type="date" id="dataGastos">
        </div>
        <div class="input-group">
            <label for="cat-gastos">Categoria</label>
            <select id="cat-gastos">
                <option disabled selected>Escolha uma categoria</option>
            </select>
        </div>
        <button class="btn-confirm" id="btnGasto">Adicionar gasto</button>
    </dialog>

    <!-- MODAL - FILTRO -->
    <dialog id="modal-3">
        <div class="modal-header">
            <span class="modal-title">Filtrar gastos</span>
            <button class="close-modal" type="button" data-modal="modal-3">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="input-group">
            <!-- <label for="tipofiltro">Filtrar por:</label> -->
            <select id="tipofiltro" onchange="mostrarFiltro()"> 
                <option value="" disabled selected>Selecione uma opção</option>
                <option value="data">Data</option>
                <option value="categoria">Categoria</option>
                <option value="valor">Valor</option>
            </select>
        </div>

        <div id="filtroCategoria" style="display: none;">
            <div class="input-group">
                <label>Categoria</label>
                <select id="filtroCategoria"></select>
            </div>
        </div>

        <div id="filtro-valor" style="display: none;">
            <div class="input-group">
                <label>Valor Minimo</label>
                <input type="text" id="filtroMin" placeholder="Ex: 100,00">
            </div>

            <div class="input-group">
                <label>Valor Máximo</label>
                <input type="text" id="filtroMax" placeholder="Ex: 500,00">
            </div>
        </div>

        <div id="filtro-data" style="display: none;">
            <div class="input-group">
                <label>Data Inicial</label>
                <input type="date" id="dataInicial">
            </div>

            <div class="input-group">
                <label>Data Final</label>
                <input type="date" id="dataFinal">
            </div>
        </div>

        <button class="btn-confirm" id="btnFiltro" onclick="filtrarGastos()">Aplicar filtro</button>
        <button class="btn-confirm" id="btnFiltro" onclick="limparFiltro()">Limpar filtro</button>

    </dialog>
    

    <script src="../script/gernDados.js/script.js"></script>

</body>

</html>
