<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - organized.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/login.css">
</head>

<body>

  <a href="home.html" class="logo-link">
    <img src="../assets/Logo off-white.png" alt="Logo" class="logo">
  </a>

  <div class="container">
    <div class="brand-panel">
      <h1>
        <span>Bem-vindo de volta</span>
        Entre na<br>sua conta.
      </h1>
      <p>Acesse sua conta para continuar acompanhando seus gastos e finanças pessoais.</p>
    </div>

    <form class="form-panel" onsubmit="logar(event)">

      <h2>Login</h2>
      <p class="subtitle">Preencha suas credenciais para continuar</p>

      <div class="field">
        <label>E-mail</label>
        <input id="email" type="email" placeholder="seuemail@exemplo.com">
      </div>

      <div class="field">
        <label>Senha</label>
        <div class="password-wrapper">
          <input type="password" id="senha" placeholder="••••••••">
          <button type="button" class="toggle-password" onclick="toggleSenha()">
            <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg id="icon-eye-off" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
              style="display:none">
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>
      </div>

      <div class="forgot">
        <a href="#">Esqueci minha senha</a>
      </div>

      <button type="submit" id="btn-entrar" class="btn">Entrar</button>

      <div class="divider"><span>ou</span></div>

      <p class="register-link">Não tem uma conta? <a href="cadastro.html">Criar conta</a></p>
    </form>
    <div id="toast" class="toast">
      <span id="toast-icon" class="toast-icon"></span>
      <span id="toast-msg"></span>
    </div>
  </div>
  <script src="../script/login.js"></script>
</body>

</html>
