<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - organized.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style/cadastro.css">
</head>

<body>

  <a href="home.html" class="logo-link">
    <img src="../assets/Logo off-white.png" alt="Logo" class="logo">
  </a>

  <div class="container">
    <div class="brand-panel">
      <h1>
        <span>Bem-vindo</span>
        Crie sua<br>conta agora.
      </h1>
      <p>Preencha seus dados ao lado e comece a aproveitar todos os recursos da plataforma.</p>
    </div>

    <form class="form-panel" id="formCadastro">
      <h2>Cadastro</h2>
      <p class="subtitle">Preencha as informações abaixo para continuar</p>

      <div class="row">
        <div class="field">
          <label>Nome</label>
          <input type="text" id="nome" placeholder="Seu nome" required>
        </div>
        <div class="field">
          <label>Sobrenome</label>
          <input type="text" id="sobrenome" placeholder="Seu sobrenome" required>
        </div>
      </div>

      <div class="field">
        <label>E-mail</label>
        <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
      </div>

      <div class="field">
        <label>Telefone</label>
        <input type="tel" id="tel" placeholder="(00) 00000-0000" maxlength="15" required>
      </div>

      <div class="row">
        <div class="field">
          <label>Senha</label>
          <input type="password" id="senha" placeholder="••••••••" required>
        </div>
        <div class="field">
          <label>Confirmar senha</label>
          <input type="password" id="senhaConfirm" placeholder="••••••••" required>
        </div>
      </div>

      <label class="terms">
        <input type="checkbox" required>
        Concordo com os <a href="#">Termos de Uso</a> e <a href="#">Privacidade</a>
      </label>

      <button type="submit" class="btn" id="submit">Criar conta</button>

      <p class="login-link">Já tem uma conta? <a href="login.html">Entrar</a></p>
    </form>
  </div>

  <div id="toast" class="toast">
    <span id="toast-icon" class="toast-icon"></span>
    <span id="toast-msg"></span>
  </div>

  <script type="module" src="../script/cadastro.js"></script>
</body>

</html>
